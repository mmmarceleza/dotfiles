; Feral Interactive GameMode
; Applied per game via Steam launch options: gamemoderun %command%
; Reference: https://github.com/FeralInteractive/gamemode/blob/master/example/gamemode.ini

[general]
; Raise the game's priority by 10 (nice -10).
; Requires membership in the "gamemode" group, granted by
; /etc/security/limits.d/10-gamemode.conf (shipped by the gamemode package).
; Note: under Proton this only reaches the Linux wrapper chain (reaper, pv-adverb,
; proton), not the Windows process itself. Native Linux games get the full benefit.
renice = 10

; CPU governor while a game is running.
desiredgov = performance

; defaultgov is intentionally unset so gamemode restores whatever governor it found.
; Do NOT set schedutil here: the amd-pstate-epp driver only exposes performance and
; powersave, so the restore fails silently and leaves the CPU pinned at performance.
; Check available values with:
;   cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors

; SCHED_ISO requires a MuQSS/PDS kernel and does not exist in mainline Linux.
; Leaving this on only floods the journal with "Failed setting client into
; SCHED_ISO mode" errors on every client registration.
softrealtime = off

; Keep the screen from blanking during gameplay.
inhibit_screensaver = 1

; NVIDIA optimisations are disabled on purpose: nv_powermizer_mode is unreliable
; on Wayland and needs nvidia-settings. Enable only if clock throttling shows up.
;[gpu]
;apply_gpu_optimisations = accept-responsibility
;gpu_device = 0
;nv_powermizer_mode = 1
